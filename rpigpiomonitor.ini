[sht45_temp]
type = temperature
description = SHT45 Temperature
lowlimit = 5
lowwarnlimit = 10
warnlimit = 38
highlimit = 45
external_gpio_reader = /usr/local/bin/sht45-temperature

[sht45_hum]
type = humidity
description = SHT45 Humidity
lowlimit = 15
lowwarnlimit = 20
warnlimit = 60
highlimit = 70
external_gpio_reader = /usr/local/bin/sht45-humidity
